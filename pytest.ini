[pytest]
minversion = 9.0
testpaths =
    backend/tests
    tests
pythonpath =
    backend/src
    scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
    -x
    --tb=short
    --color=yes

filterwarnings =
    ignore:cannot collect test class.*TestingConfig:pytest.PytestCollectionWarning

markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need DB / network)
    property: Property-based tests (hypothesis)
    performance: Benchmarks and performance regression tests
    slow: Slow-running tests
strict_xfail = true
