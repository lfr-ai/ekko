# Codecov configuration
# https://docs.codecov.io/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach,diff,flags"
  require_changes: true

flags:
  backend:
    paths:
      - backend/src/ekko/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "tests/**"
  - "backend/src/ekko/cli/**"
  - "**/__init__.py"
  - "**/conftest.py"
  - "tools/**"
  - "registry/**"
