[project]
name = "ekko"
version = "0.1.0"
description = "Ekko — AI-powered voice assistant platform"
authors = [{ name = "Laurits Fromberg", email = "lfr@tik-ai.dk" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.136.3",
  "starlette>=1.3.1",
  "uvicorn>=0.35.0",
  "openai>=2.36.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.1,<2.11",
  "sqlalchemy>=2.0.41",
  "alembic>=1.11.1",
  "aiosqlite>=0.20.0",
  "keyboard>=0.13.5; sys_platform == 'win32'",
  "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
  "websockets>=15.0.1",
  "tiktoken>=0.11.0",
  "azure-cognitiveservices-speech>=1.40.0",
  "numpy>=1.26",
  "strawberry-graphql[fastapi]>=0.316.0",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "mako>=1.3.12",
  "prometheus-fastapi-instrumentator>=6.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "tenacity>=9.0.0",
  "litellm>=1.93.2",
  "redis>=5.2.1",
  # Runtime dep so the frozen PyInstaller EXE can satisfy pkg_resources lookups.
  "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-mock>=3.17.0",
  "pytest-xdist>=3.8.0",
  "pytest-benchmark>=5.3.1",
  "hypothesis>=6.170.14",
  "factory-boy>=3.3.3",
  "freezegun>=1.4",
  "respx>=0.22",
  "pre-commit>=4.3.0",
  "pre-commit-hooks>=6.0.0",
  "ruff>=0.16.10",
  "commitizen>=4.13.9",
  "ty>=0.0.32",
  "import-linter>=2.0",
  "bandit[toml]>=1.9.4",
  "detect-secrets>=1.5.0",
  "xenon>=0.9.3",
  "typos>=1.45.1",
  "yamllint>=1.37.1",
  "pyyaml>=6.0.2",
  "tox>=4.28.4",
  "tox-uv>=1.16.0",
  "pyinstaller>=6.0",
  "testcontainers[postgres]>=4.14.2",
  "asyncpg>=0.30.0",
  "diff-cover>=10.3.0",
]
audit = ["pip-audit>=2.10.0", "pip-licenses>=5.5.0"]

[tool.uv]
package = false
default-groups = ["dev"]
keyring-provider = "subprocess"

# Clean Architecture enforcement (import-linter) lives in the dedicated
# `.importlinter` file at the backend root — see the clean-architecture skill.
# Run with: task architecture

# Dependency license compliance. pip-licenses only reads config from a
# pyproject.toml in its working directory, so this table must stay here — it is
# the one tool config that genuinely cannot be externalised — and the check runs
# from backend/ (see `task security:licenses`, which does). The
# allowlist is deliberately permissive across the common permissive/weak-copyleft
# OSS licenses; add a package to `ignore-packages` only when its license is a
# known, accepted exception rather than widening the allowlist.
#
# Documented exceptions (each a deliberate compliance decision):
#   ekko                            - the project itself; no license classifier.
#   yamllint                        - GPL-3.0 dev-only tool, never distributed.
#   azure-cognitiveservices-speech  - Microsoft proprietary Azure Speech SDK;
#                                     required STT runtime dep, no OSS alternative.
#   pyinstaller                     - GPLv2 with the standard bootloader
#                                     exception that permits bundling into
#                                     proprietary apps (used for the desktop EXE).
[tool.pip-licenses]
from = "mixed"
partial-match = true
allow-only = "Apache;BSD;ISC;LGPL;MIT;Mozilla Public License;MPL;PSF;Python Software Foundation;Unlicense"
ignore-packages = [
  "ekko",
  "yamllint",
  "azure-cognitiveservices-speech",
  "pyinstaller",
]
