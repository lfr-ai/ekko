---
extends: default

ignore: |
  .venv/
  .venv*/
  **/.venv/
  **/.venv*/
  .bun/
  **/.bun/
  frontend/~/**
  **/frontend/~/**
  node_modules/
  **/node_modules/
  playwright-report/
  **/playwright-report/
  test-results/
  **/test-results/

rules:
  line-length:
    max: 88
    level: warning
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false
  document-start: disable
  new-lines: disable
  empty-lines:
    max: 1
    max-end: 1
  brackets: disable
  commas: disable
