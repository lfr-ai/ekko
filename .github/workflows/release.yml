name: Release

# Tag-triggered release pipeline: builds the Windows frozen app (PyInstaller),
# packages it, computes SHA256 checksums, generates an SBOM, attests build
# provenance (SLSA, via Sigstore/OIDC), and publishes everything as a GitHub
# Release. Triggered by tags matching the `v$version` format from .cz.toml.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    name: Build, attest, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-extras --dev

      - name: Derive release version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and smoke frozen application
        shell: pwsh
        run: ./scripts/build_exe.ps1

      # --- Code-signing plug-in point ----------------------------------
      # No Authenticode/EV code-signing certificate is available in this
      # repo, so dist/ekko/ekko.exe (and its bundled DLLs) ship unsigned.
      # To wire up real signing once a certificate is purchased, insert a
      # step here (before packaging) that imports
      # secrets.WINDOWS_CODESIGN_CERT / secrets.WINDOWS_CODESIGN_CERT_PASSWORD
      # and runs:
      #   signtool sign /fd SHA256 /tr <RFC3161 timestamp URL> /td SHA256
      #     dist/ekko/ekko.exe
      # -------------------------------------------------------------------

      - name: Package release archive
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archiveName = "ekko-$($env:VERSION)-windows-x64.zip"
          Compress-Archive -Path "dist/ekko/*" -DestinationPath "dist/$archiveName" -Force
          "archive-name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/ekko
          format: spdx-json
          output-file: dist/ekko-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Compute SHA256 checksums
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.archive-name }}
        run: |
          $targets = @(
            @{ Path = "dist/$($env:ARCHIVE_NAME)"; Label = $env:ARCHIVE_NAME },
            @{ Path = "dist/ekko/ekko.exe"; Label = "ekko/ekko.exe" },
            @{ Path = "dist/ekko-sbom.spdx.json"; Label = "ekko-sbom.spdx.json" }
          )
          $lines = foreach ($target in $targets) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $target.Path).Hash.ToLower()
            "$hash  $($target.Label)"
          }
          Set-Content -Path dist/checksums.txt -Value $lines -Encoding utf8NoBOM

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.package.outputs.archive-name }}
            dist/ekko/ekko.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive-name }}
        run: |
          $assets = @(
            "dist/$($env:ARCHIVE_NAME)",
            "dist/ekko-sbom.spdx.json",
            "dist/checksums.txt"
          )
          gh release create $env:TAG_NAME @assets --title "Ekko $($env:TAG_NAME)" --generate-notes
