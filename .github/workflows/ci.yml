name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =================================================================
  # Backend: Lint, Type Check, and Test
  # =================================================================
  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Lint with ruff
        run: cd backend && uv run ruff check src tests

      - name: Format check with ruff
        run: cd backend && uv run ruff format --check src tests

      - name: Lint tools, scripts, and root tests
        run: uv run --project backend ruff check tools scripts tests

      - name: Format check tools, scripts, and root tests
        run: uv run --project backend ruff format --check tools scripts tests

      - name: Lint YAML configuration
        run: uv run --project backend yamllint -c .yamllint.yaml .

      - name: Prune uv cache
        run: uv cache prune --ci

  backend-typecheck:
    name: Backend type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Type check with ty
        run: cd backend && uv run python -m ty check src/ekko tests ../tests ../tools ../scripts ../registry alembic

      - name: Prune uv cache
        run: uv cache prune --ci

  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: cd backend && uv run python -m pytest tests/unit -q

      - name: Prune uv cache
        run: uv cache prune --ci

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Run integration tests
        run: cd backend && uv run python -m pytest tests/integration -v --tb=short -m integration

      - name: Prune uv cache
        run: uv cache prune --ci

  repository-tests:
    name: Repository-level Python tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install backend dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Run repository-level tests
        run: uv run --project backend python -m pytest tests/ -q

      - name: Prune uv cache
        run: uv cache prune --ci

  # =================================================================
  # API Contract Lint (OpenAPI / Redocly)
  # =================================================================
  api-contract:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Generate OpenAPI schema
        run: cd backend && uv run python ../tools/generate_openapi.py

      - name: Lint OpenAPI contract with Redocly
        run: bunx --bun @redocly/cli@2.58.1 lint

      - name: Prune uv cache
        run: uv cache prune --ci

  # =================================================================
  # Security Scans
  # =================================================================
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Run bandit
        run: cd backend && uv run python -m bandit -c ../bandit.toml -r src/ekko

      - name: Run dependency audit
        run: python scripts/security/dependency_audit.py

      - name: Run detect-secrets
        run: cd backend && uv run detect-secrets scan --baseline ../.secrets.baseline

      - name: Prune uv cache
        run: uv cache prune --ci

  # =================================================================
  # Architecture & Code Quality
  # =================================================================
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Check architecture boundaries
        run: uv run --project backend python tools/security/check_architecture_boundaries.py

      - name: Report results
        if: always()
        run: |
          echo "### Clean Architecture Boundary Check" >> $GITHUB_STEP_SUMMARY
          echo "Architecture boundary enforcement completed." >> $GITHUB_STEP_SUMMARY

  magic-strings:
    name: Magic string check
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check magic strings
        id: check
        run: |
          python tools/conventions/check_magic_strings.py > output.txt 2>&1
          exit_code=$?
          cat output.txt
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Report results
        if: always()
        run: |
          echo "### Magic String Constants Check" >> $GITHUB_STEP_SUMMARY
          if [ -f output.txt ]; then
            violation_count=$(grep -c "violation" output.txt || echo "0")
            echo "Violations found: $violation_count" >> $GITHUB_STEP_SUMMARY
          else
            echo "Check completed successfully." >> $GITHUB_STEP_SUMMARY
          fi

  # =================================================================
  # Workflow Validation
  # =================================================================
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          fail-on-error: true

  # =================================================================
  # Shell Script Validation
  # =================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint shell scripts
        run: |
          if [ -d .github/hooks/scripts ]; then
            shellcheck --severity=warning .github/hooks/scripts/*.sh
          fi
          if [ -d scripts ]; then
            find scripts -name "*.sh" -exec shellcheck --severity=warning {} +
          fi

  # =================================================================
  # Link Validation
  # =================================================================
  links:
    name: Check markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --config .lychee.toml
            "**/*.md"
          fail: true

  # =================================================================
  # OpenSpec Validation
  # =================================================================
  openspec-validation:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Validate OpenSpec artifacts (strict)
        run: bunx --bun @fission-ai/openspec@1.13.2 validate --all --strict

      - name: Validate OpenSpec schema
        run: bunx --bun @fission-ai/openspec@1.13.2 schema validate ekko-production

  # =================================================================
  # Frontend: Lint, Type Check, Test, and Build
  # =================================================================
  frontend-quality:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Architecture boundaries
        run: node ./scripts/check-architecture.mjs

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  frontend-storybook:
    name: Frontend Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Run Storybook tests
        run: bun run test:storybook

  windows-frozen-app:
    name: Windows frozen application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          uv-version: "0.12.5"
          enable-cache: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-extras --dev

      - name: Build and smoke frozen application
        shell: pwsh
        run: ./scripts/build_exe.ps1

  # =================================================================
  # All Checks Complete
  # =================================================================
  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - backend-integration
      - repository-tests
      - security
      - architecture
      - magic-strings
      - api-contract
      - actionlint
      - shellcheck
      - links
      - openspec-validation
      - frontend-quality
      - frontend-storybook
      - windows-frozen-app
    steps:
      - name: Report success
        run: echo "All CI checks passed successfully!"
