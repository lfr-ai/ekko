name: Coverage Upload

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: cd backend && uv run python -m pytest tests/unit --quiet --maxfail=1 --cov=src/ekko --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          disable_search: true
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Prune uv cache
        run: uv cache prune --ci

  frontend-coverage:
    name: Frontend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: >-
          bun run vitest run --coverage
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json
          --coverage.reporter=lcov

      - name: Verify coverage artifacts
        run: |
          test -f coverage/coverage-final.json
          test -f coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/coverage-final.json,frontend/coverage/lcov.info
          disable_search: true
          flags: frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
