# Dependabot configuration for Ekko
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Backend Python dependencies (uv)
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 3
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - backend
      - python
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Frontend dependencies (bun lockfile + package.json)
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 3
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - frontend
      - javascript
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - ci
      - github-actions
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker images in production/container files
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Docker images used by the local devcontainer build
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - docker
      - devcontainer
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      devcontainer-docker-dependencies:
        patterns:
          - "*"

  # Devcontainer Features in devcontainer.json
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - devcontainer
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      devcontainer-feature-dependencies:
        patterns:
          - "*"

  # Docker Compose image references
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: cron
      cronjob: "every 2 weeks on monday at 06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    assignees:
      - lauritsfromberg
    labels:
      - dependencies
      - docker
      - compose
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
